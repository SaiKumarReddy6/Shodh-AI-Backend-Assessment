services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shodh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shodh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shodh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shodh_postgres_data:
